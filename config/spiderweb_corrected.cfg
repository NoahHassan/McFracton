# Cluster run of Spiderweb_corrected, as read by: mcf_run --config config/spiderweb_corrected.cfg
#
# A heating scan from the ground state. Cooling freezes instantons in below T* ~ 0.45, so only a
# heating scan is trustworthy there. scripts/slurm_seeds.sh runs this file once per seed.

system        = Spiderweb_corrected
linear_size   = 24
temporal_size = 24
KU            = 1.0

# Temperature schedule: t_fac > 1 starts at t_min and multiplies by t_fac until t_max is passed.
# 1.05 gives 33 temperatures between 0.2 and 1.0.
t_min = 0.2
t_max = 1.0
t_fac = 1.05
ground_state_start = true

# Monte Carlo effort per temperature. One sweep is one update per variable on average:
# 24 * 24 * 24 * 3/2 = 20736. Change it together with the lattice size.
updates_per_sweep    = 20736
initial_therm_sweeps = 100
max_therm_sweeps     = 5000
max_measure_sweeps   = 500
n_measurements       = 20
delta                = 0.1

# Spiderweb_corrected has no overrelaxation: switching this on makes the run throw.
overrelax = false

# 0 draws a fresh seed and records the one it drew in the log header. The Slurm script overrides it.
seed = 0

# out = results/spiderweb_corrected.txt
