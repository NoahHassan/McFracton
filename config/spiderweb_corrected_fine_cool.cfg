# Cooling check for config/spiderweb_corrected_fine.cfg: the same window, T = 0.60 -> 0.44 in steps of 1 %,
# from a random start. Where heating and cooling agree, both are equilibrium; where they do not, the
# difference is hysteresis (a first-order transition or a frozen-in sector). Everything except the
# direction and the start is the same as in the heating file.
#
#   sbatch --array=100-103 scripts/slurm_seeds.sh config/spiderweb_corrected_fine_cool.cfg  # seeds 1100-1103

system        = Spiderweb_corrected
linear_size   = 32
temporal_size = 32
KU            = 1.0

t_min = 0.44
t_max = 0.60
t_fac = 0.99
ground_state_start = false

updates_per_sweep    = 49152
initial_therm_sweeps = 150
max_therm_sweeps     = 2000
max_measure_sweeps   = 150
n_measurements       = 200
delta                = 0.1

bin_size = 20

overrelax = false
seed = 0
