# Example run configuration, as read by: mcf_run --config config/spiderweb.cfg
#
# Any key here can be overridden on the command line with --key=value, which is how the Slurm
# array in scripts/slurm_array.sh varies one setting per task. "mcf_run --list" prints the
# systems and the parameters each one takes.

system        = Spiderweb
linear_size   = 16
temporal_size = 16
KU            = 0.5

# Temperature schedule: start at t_max and multiply by t_fac until t_min is passed.
t_max = 100.0
t_min = 0.1
t_fac = 0.9

# Monte Carlo effort per temperature.
updates_per_sweep    = 5000
initial_therm_sweeps = 100
max_therm_sweeps     = 5000
max_measure_sweeps   = 500
n_measurements       = 10
delta                = 0.1

# Spiderweb has no overrelaxation, so leave this off for it.
overrelax                  = false
updates_per_overrelaxation = 10000

# 0 draws a fresh seed and records the one it drew in the log header.
seed = 0

# out = results/spiderweb.txt
