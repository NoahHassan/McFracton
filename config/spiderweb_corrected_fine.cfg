# Production run of Spiderweb_corrected around the transition, as read by
#   mcf_run --config config/spiderweb_corrected_fine.cfg
#
# Heating from the ground state through T = 0.44 -> 0.60 in steps of 1 % (32 temperatures). The cooling
# check runs the same window downwards from a random start: config/spiderweb_corrected_fine_cool.cfg.
#
#   mkdir -p logs
#   sbatch --array=0-11   scripts/slurm_seeds.sh config/spiderweb_corrected_fine.cfg        # seeds 1000-1011
#   sbatch --array=100-103 scripts/slurm_seeds.sh config/spiderweb_corrected_fine_cool.cfg  # seeds 1100-1103
#   python scripts/analyse_bins.py results/spiderweb_corrected_fine_job=<id>_seed=*_bins.txt \
#       --discard 0.25 --out fine.tsv --plot fine.png
#
# Thermalization: the L = 32 pilot (CLUSTER_PLAN.md, 5d) showed that near T* the energy keeps relaxing for
# thousands of sweeps after a temperature step, longer than the code's own thermalization (20 tau of the
# previous temperature, capped by max_therm_sweeps). So the measurement phase is made long and the analysis
# drops its first quarter (--discard 0.25); the drift test in analyse_bins.py checks that this was enough.
#
# Effort: measurement sweeps per temperature = n_measurements * min(max_measure_sweeps, 20 tau_E), i.e. up
# to 30 000 near T* and ~16 000 at the cold end; ~0.9 M sweeps per chain in total. At the pilot's 58 ms per
# sweep (laptop, pessimistic) that is ~14 h. Logs are flushed per temperature, so a job stopped by its time
# limit keeps every temperature it finished.

system        = Spiderweb_corrected
linear_size   = 32
temporal_size = 32
KU            = 1.0

t_min = 0.44
t_max = 0.60
t_fac = 1.01
ground_state_start = true

# One sweep is one update per variable on average: 32 * 32 * 32 * 3/2.
updates_per_sweep    = 49152
# Also the measurement spacing at the first temperature (a known quirk), so it matches max_measure_sweeps.
initial_therm_sweeps = 150
max_therm_sweeps     = 2000
max_measure_sweeps   = 150
n_measurements       = 200
delta                = 0.1

# Bin means of every observable and its square over 20 sweeps, written to <out>_bins.txt.
bin_size = 20

overrelax = false
seed = 0
